<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" width="1200" height="630">
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#0B0420"/>
      <stop offset="46%" stop-color="#1A0B3B"/>
      <stop offset="78%" stop-color="#3B1770"/>
      <stop offset="100%" stop-color="#150832"/>
    </linearGradient>
    <radialGradient id="neb1" cx="72%" cy="24%" r="52%">
      <stop offset="0%" stop-color="#7B2CBF" stop-opacity=".62"/>
      <stop offset="100%" stop-color="#7B2CBF" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="neb2" cx="22%" cy="72%" r="52%">
      <stop offset="0%" stop-color="#4B0082" stop-opacity=".62"/>
      <stop offset="100%" stop-color="#4B0082" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="moon" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#FFFFFF"/>
      <stop offset="42%" stop-color="#E9D5FF"/>
      <stop offset="100%" stop-color="#C77DFF" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="titleG" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#FFFFFF"/>
      <stop offset="58%" stop-color="#E7CFFF"/>
      <stop offset="100%" stop-color="#C77DFF"/>
    </linearGradient>
    <linearGradient id="rainbow" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#FF6B6B"/><stop offset="18%" stop-color="#FFB84D"/>
      <stop offset="36%" stop-color="#FFE66D"/><stop offset="54%" stop-color="#6BE6A1"/>
      <stop offset="72%" stop-color="#5AA9FF"/><stop offset="88%" stop-color="#9A6BFF"/>
      <stop offset="100%" stop-color="#C77DFF"/>
    </linearGradient>
  </defs>

  <rect width="1200" height="630" fill="url(#sky)"/>
  <rect width="1200" height="630" fill="url(#neb1)"/>
  <rect width="1200" height="630" fill="url(#neb2)"/>

  <!-- stars -->
  <g fill="#fff">
    <circle cx="90" cy="80" r="2.4"/><circle cx="188" cy="152" r="1.6"/><circle cx="292" cy="62" r="2"/>
    <circle cx="410" cy="128" r="1.4"/><circle cx="530" cy="58" r="2.2"/><circle cx="648" cy="146" r="1.6"/>
    <circle cx="766" cy="72" r="2"/><circle cx="884" cy="132" r="1.5"/><circle cx="1002" cy="56" r="2.3"/>
    <circle cx="1112" cy="122" r="1.7"/><circle cx="140" cy="238" r="1.5"/><circle cx="1058" cy="228" r="1.8"/>
    <circle cx="330" cy="212" r="1.3"/><circle cx="820" cy="212" r="1.4"/><circle cx="600" cy="196" r="1.2"/>
    <circle cx="60" cy="320" r="1.4"/><circle cx="1150" cy="330" r="1.5"/><circle cx="250" cy="300" r="1.1"/>
    <circle cx="960" cy="300" r="1.2"/>
  </g>

  <!-- moon -->
  <circle cx="920" cy="176" r="128" fill="url(#moon)" opacity=".72"/>
  <circle cx="920" cy="176" r="56" fill="#F7ECFF"/>
  <circle cx="920" cy="176" r="70" fill="#E9D5FF" opacity=".3"/>

  <!-- rainbow bridge -->
  <path d="M120 560 Q600 330 1080 560" fill="none" stroke="url(#rainbow)" stroke-width="9" opacity=".5"/>

  <!-- castle silhouette -->
  <g fill="#2A1152">
    <rect x="470" y="392" width="260" height="168"/>
    <rect x="438" y="342" width="52" height="218"/>
    <rect x="710" y="332" width="52" height="228"/>
    <rect x="546" y="322" width="42" height="238"/>
    <rect x="612" y="300" width="46" height="260"/>
    <rect x="676" y="336" width="40" height="224"/>
  </g>
  <g fill="#C77DFF">
    <polygon points="438,342 464,296 490,342"/>
    <polygon points="710,332 736,282 762,332"/>
    <polygon points="546,322 567,286 588,322"/>
    <polygon points="612,300 635,248 658,300"/>
    <polygon points="676,336 696,300 716,336"/>
  </g>
  <g fill="#FFD700">
    <rect x="452" y="386" width="24" height="34" rx="11"/>
    <rect x="724" y="378" width="24" height="34" rx="11"/>
    <rect x="556" y="372" width="22" height="32" rx="10"/>
    <rect x="622" y="352" width="26" height="36" rx="12"/>
    <rect x="686" y="382" width="20" height="30" rx="10"/>
    <rect x="588" y="446" width="26" height="42" rx="12"/>
    <rect x="632" y="446" width="26" height="42" rx="12"/>
    <rect x="682" y="446" width="26" height="42" rx="12"/>
    <rect x="540" y="446" width="26" height="42" rx="12"/>
  </g>

  <!-- foreground haze -->
  <rect y="470" width="1200" height="160" fill="#3B1770" opacity=".42"/>
  <rect y="560" width="1200" height="70" fill="#150832" opacity=".72"/>

  <!-- title -->
  <text x="600" y="146" text-anchor="middle" font-family="Georgia, 'Times New Roman', serif"
        font-size="72" font-style="italic" fill="url(#titleG)">Nishi's Purple Universe</text>
  <text x="600" y="196" text-anchor="middle" font-family="Helvetica, Arial, sans-serif"
        font-size="23" letter-spacing="11" fill="#C77DFF">A CINEMATIC FAN TRIBUTE · OT7 · ARMY</text>
  <rect x="470" y="222" width="260" height="3" rx="1.5" fill="url(#rainbow)" opacity=".85"/>
  <text x="600" y="600" text-anchor="middle" font-family="Georgia, serif" font-style="italic"
        font-size="26" fill="#E7CFFF">Seven stars · one sky · a thousand little dreams</text>
</svg>
