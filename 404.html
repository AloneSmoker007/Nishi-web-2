<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="theme-color" content="#0B0420">

  <title>Lost among the stars · Nishi's Purple Universe</title>
  <style>
    :root{color-scheme:dark;--bg:#0B0420;--violet:#C77DFF;--text:#F3ECFF;--muted:#C4B2E4}
    *{box-sizing:border-box}
    body{margin:0;min-height:100vh;display:grid;place-items:center;padding:24px;background:radial-gradient(ellipse at 50% 18%,#35105e 0,transparent 52%),linear-gradient(160deg,#0B0420,#1A0B3B 70%,#100522);color:var(--text);font:17px/1.7 system-ui,-apple-system,"Segoe UI",sans-serif;text-align:center}
    main{width:min(620px,100%);padding:clamp(28px,6vw,56px);border:1px solid #C77DFF55;border-radius:28px;background:#16092dcc;box-shadow:0 20px 80px #0008}
    .stars{font-size:clamp(32px,8vw,58px);letter-spacing:.2em;text-shadow:0 0 24px #C77DFF}
    h1{margin:.2em 0;font-size:clamp(30px,7vw,48px);line-height:1.1}
    p{color:var(--muted);margin:14px 0 26px}
    a{display:inline-block;padding:12px 22px;border-radius:999px;background:linear-gradient(120deg,#7B2CBF,#C77DFF);color:#16072b;font-weight:800;text-decoration:none}
    a:focus-visible{outline:3px solid white;outline-offset:4px}
    .bn{display:block;margin-top:22px;color:#E6D6FF;font-size:15px}
  </style>
</head>
<body>
  <main>
    <div class="stars" aria-hidden="true">✦ ✧ ✦</div>
    <p>404 · A little detour through the galaxy</p>
    <h1>You've drifted beyond this realm.</h1>
    <p>The page you're looking for may have moved, but Nishi's Purple Universe is still right here.</p>
    <a href="/Nishi-Purple-Universe/">Return to the universe 💜</a>
    <span class="bn" lang="bn">তুমি একটু অন্য পথে চলে এসেছো। চলো, আবার আমাদের বেগুনি মহাবিশ্বে ফিরে যাই।</span>
  </main>
</body>
</html>
